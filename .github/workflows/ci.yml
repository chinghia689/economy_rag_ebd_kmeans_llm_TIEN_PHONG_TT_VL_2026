name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install numpy scipy pytest
      - name: Check Python syntax
        run: python -m compileall -q Folder_All/ingestion Folder_All/scoring Folder_All/chatbot
      - name: Run unit tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Folder_All/frontend_react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Folder_All/frontend_react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
